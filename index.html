<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Note App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">📝 Custom Note App</h2>

    <!-- Navigation -->
    <div class="mb-4 text-center">
      <button class="btn btn-primary me-2" id="addNoteTab">Add Note</button>
      <button class="btn btn-secondary" id="viewNotesTab">View Notes</button>
      <!-- Why this nav approach for simplicity: easy view switching without routes -->
    </div>

    <!-- Error Message -->
    <div id="errorBanner" class="alert alert-danger d-none" role="alert">
      Failed to save note. Storage quota might be full.
      <!-- Why display error banner: improves UX when storage fails. -->
    </div>

    <!-- Loading Spinner -->
    <div id="spinner" class="text-center d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p>Saving...</p>
      <!-- Why show spinner here: gives user feedback during async save. -->
    </div>

    <!-- Add Note Form -->
    <div id="addNoteSection">
      <form id="noteForm">
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" required />
        </div>
        <div class="mb-3">
          <label for="content" class="form-label">Content</label>
          <textarea class="form-control" id="content" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Save Note</button>
      </form>
    </div>

    <!-- Notes List -->
    <div id="notesSection" class="d-none">
      <div id="notesList" class="row"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
  crossorigin="anonymous"></script>
  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
